<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F4F6F9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>月度健身打卡</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#E7ECF2;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#1B2430;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }
  :root{
    --brand:#FF6B35;
    --brand-deep:#E2542A;
    --brand-soft:#FFF1EA;
    --brand-line:#FFD9C9;
    --ink:#1B2430;
    --ink2:#5A6675;
    --ink3:#9BA6B2;
    --line:#EDF0F4;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --green:#12A06B;
    --green-soft:#E8F7F1;
    --blue:#3B82F6;
    --blue-soft:#EBF2FF;
    --grey-soft:#EEF1F5;
    --shadow:0 2px 10px rgba(23,38,64,.05);
  }

  /* ============ 手机外壳 ============ */
  .phone{
    position:relative;
    width:390px; height:844px;
    background:var(--bg);
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow:0 24px 70px rgba(20,32,56,.20), 0 2px 8px rgba(20,32,56,.08);
    border-radius:38px;
  }
  @media (max-width:479px){
    body{ display:block; background:var(--bg); }
    .phone{ width:100vw; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }
  }

  .statusbar{
    height:36px; flex:0 0 36px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:12px; font-weight:600; color:var(--ink2);
    letter-spacing:.3px;
  }
  .statusbar .dots{ display:flex; gap:4px; align-items:center; }
  .statusbar .dots i{ display:block; width:4px; height:4px; border-radius:50%; background:var(--ink3); }

  .viewport{
    flex:1 1 auto;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:0 16px 96px;
    scrollbar-width:none;
  }
  .viewport::-webkit-scrollbar{ display:none; }

  .page{ animation:fade .26s ease; }
  .page.hidden{ display:none; }
  @keyframes fade{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

  /* ============ 顶部进度区 ============ */
  .hero{
    padding:6px 4px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .hero .mon{
    display:flex; align-items:center; gap:6px;
    font-size:21px; font-weight:700; letter-spacing:-.2px;
  }
  .mon-btn{
    width:26px; height:26px; border:none; border-radius:50%;
    background:#fff; color:var(--ink2); font-size:15px; line-height:1;
    display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .15s, background .15s;
  }
  .mon-btn:active{ transform:scale(.9); background:var(--brand-soft); color:var(--brand-deep); }
  .hero .sub{ margin-top:8px; font-size:12.5px; color:var(--ink2); }
  .hero .sub b{ color:var(--brand-deep); font-size:14px; }
  .streak{
    margin-top:10px; display:inline-flex; align-items:center; gap:5px;
    background:var(--brand-soft); color:var(--brand-deep);
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:20px;
  }
  .ring-wrap{ position:relative; width:78px; height:78px; flex:0 0 78px; }
  .ring-wrap .ring-txt{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; line-height:1;
  }
  .ring-txt .n{ font-size:19px; font-weight:700; letter-spacing:-.5px; }
  .ring-txt .n span{ font-size:11px; font-weight:600; }
  .ring-txt .t{ font-size:9.5px; color:var(--ink3); margin-top:3px; }

  /* ============ 卡片 ============ */
  .card{
    background:var(--card); border-radius:18px;
    box-shadow:var(--shadow);
    padding:14px;
  }
  .card + .card{ margin-top:12px; }
  .card-title{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:600; color:var(--ink); margin-bottom:10px;
  }
  .card-title .hint{ font-size:11px; color:var(--ink3); font-weight:500; }

  /* ============ 日历 ============ */
  .weekrow{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    margin-bottom:6px;
  }
  .weekrow span{
    text-align:center; font-size:10.5px; font-weight:600; color:var(--ink3);
    letter-spacing:.5px;
  }
  .weekrow span.we{ color:#C2A99E; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cell{
    position:relative; aspect-ratio:1/0.9; border-radius:11px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; cursor:pointer; user-select:none;
    transition:background .16s, transform .12s, box-shadow .16s;
    background:#FAFBFC;
  }
  .cell:active{ transform:scale(.93); }
  .cell .d{ font-size:14px; font-weight:600; color:var(--ink); line-height:1; }
  .cell .tag{ font-size:8.5px; font-weight:600; color:var(--brand-deep); line-height:1; height:9px; letter-spacing:-.2px; }
  .cell .dot{ width:4px; height:4px; border-radius:50%; background:var(--brand); }
  .cell.blank{ background:transparent; cursor:default; }
  .cell.blank:active{ transform:none; }
  .cell.other{ background:transparent; cursor:default; }
  .cell.other .d{ color:#D3DAE2; font-weight:500; }
  .cell.other:active{ transform:none; }
  .cell.future .d{ color:#B9C3CE; }
  .cell.done{ background:var(--brand-soft); }
  .cell.done .d{ color:var(--brand-deep); }
  .cell.rest{ background:#F0F2F6; }
  .cell.rest .d{ color:#8494A6; }
  .cell.today{ box-shadow:inset 0 0 0 1.6px var(--brand); }
  .cell.sel{ background:var(--brand); box-shadow:0 6px 14px rgba(255,107,53,.32); }
  .cell.sel .d,.cell.sel .tag{ color:#fff; }
  .cell.sel .dot{ background:#fff; }

  .legend{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:10.5px; color:var(--ink3);
  }
  .legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }

  .goalbar{ margin-top:14px; }
  .goalbar .row{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink2); margin-bottom:6px; }
  .bar{ height:6px; border-radius:6px; background:var(--grey-soft); overflow:hidden; }
  .bar > i{
    display:block; height:100%; border-radius:6px;
    background:linear-gradient(90deg,#FF8A5B,#FF5A2C);
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }

  /* ============ 快速一览 ============ */
  .quick{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; }
  .qbox{
    background:var(--card); border-radius:14px; padding:11px 10px;
    box-shadow:var(--shadow);
  }
  .qbox .k{ font-size:10px; color:var(--ink3); margin-bottom:5px; }
  .qbox .v{ font-size:16px; font-weight:700; letter-spacing:-.4px; }
  .qbox .v small{ font-size:10px; font-weight:600; color:var(--ink3); margin-left:2px; }
  .qbox .v.g{ color:var(--green); }
  .qbox .v.o{ color:var(--brand-deep); }

  /* ============ 趋势页 ============ */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat{
    background:var(--card); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .stat .k{ font-size:10.5px; color:var(--ink3); margin-bottom:7px; }
  .stat .v{ font-size:21px; font-weight:700; letter-spacing:-.8px; line-height:1; }
  .stat .v small{ font-size:10.5px; font-weight:600; color:var(--ink3); margin-left:3px; letter-spacing:0; }
  .stat .d{ margin-top:6px; font-size:10.5px; font-weight:600; }
  .stat .d.up{ color:#E14D3B; }
  .stat .d.down{ color:var(--green); }
  .stat .d.flat{ color:var(--ink3); }
  .stat .ico{
    position:absolute; right:11px; top:11px; width:24px; height:24px; border-radius:8px;
    display:grid; place-items:center; font-size:12px;
  }

  .chart-box{ position:relative; }
  .empty{
    padding:34px 0; text-align:center; color:var(--ink3); font-size:12px; line-height:1.9;
  }
  .empty .big{ font-size:22px; display:block; margin-bottom:6px; opacity:.5; }

  /* ============ 我的 ============ */
  .me-head{
    display:flex; align-items:center; gap:13px; padding:10px 4px 20px;
  }
  .avatar{
    width:54px; height:54px; border-radius:18px;
    background:linear-gradient(135deg,#FF8A5B,#FF5A2C);
    display:grid; place-items:center; font-size:23px;
    box-shadow:0 8px 18px rgba(255,107,53,.3);
  }
  .me-head .nm{ font-size:17px; font-weight:700; }
  .me-head .sb{ font-size:11.5px; color:var(--ink3); margin-top:4px; }

  .list{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  .li{
    display:flex; align-items:center; gap:11px;
    padding:13px 15px; border-bottom:1px solid var(--line);
    font-size:13.5px; cursor:pointer;
  }
  .li:last-child{ border-bottom:none; }
  .li:active{ background:#FAFBFC; }
  .li .ic{ width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-size:13px; flex:0 0 26px; }
  .li .tx{ flex:1; }
  .li .tx .s{ font-size:10.5px; color:var(--ink3); margin-top:2px; }
  .li .val{ font-size:12.5px; color:var(--ink2); font-weight:600; }
  .li .arrow{ color:#C8D1DA; font-size:14px; }
  .li.danger .tx{ color:#E14D3B; }
  .section-label{
    font-size:11px; font-weight:600; color:var(--ink3); letter-spacing:.5px;
    margin:20px 6px 9px;
  }

  /* ============ 底部导航 ============ */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0; height:74px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(237,240,244,.9);
    display:flex; padding:6px 12px 16px;
    z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; cursor:pointer; color:var(--ink3); font-size:10px; font-weight:600;
    border-radius:14px; transition:color .16s;
  }
  .tab .ti{ width:21px; height:21px; display:block; opacity:.6; transition:.16s; }
  .tab.on{ color:var(--brand-deep); }
  .tab.on .ti{ opacity:1; transform:translateY(-1px); }

  /* ============ 抽屉 ============ */
  .mask{
    position:absolute; inset:0; background:rgba(18,28,45,.42);
    opacity:0; pointer-events:none; transition:opacity .28s; z-index:30;
  }
  .mask.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg); border-radius:24px 24px 0 0;
    max-height:88%; display:flex; flex-direction:column;
    transform:translateY(101%); transition:transform .34s cubic-bezier(.22,.9,.24,1);
    box-shadow:0 -10px 40px rgba(20,32,56,.16);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ padding:9px 0 4px; display:flex; justify-content:center; flex:0 0 auto; }
  .sheet-handle i{ width:36px; height:4px; border-radius:4px; background:#DCE3EB; display:block; }
  .sheet-head{
    padding:2px 18px 12px; display:flex; align-items:center; justify-content:space-between;
    flex:0 0 auto;
  }
  .sheet-head .dt{ font-size:16px; font-weight:700; letter-spacing:-.2px; }
  .sheet-head .dw{ font-size:11px; color:var(--ink3); margin-top:3px; font-weight:500; }
  .xbtn{
    width:30px; height:30px; border-radius:50%; border:none; background:#E9EEF4;
    color:var(--ink2); font-size:15px; cursor:pointer; display:grid; place-items:center;
  }
  .sheet-body{ overflow-y:auto; padding:0 16px 8px; flex:1 1 auto; }
  .sheet-body::-webkit-scrollbar{ display:none; }
  .sheet-foot{
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
    flex:0 0 auto; background:var(--bg);
    display:flex; gap:10px;
  }

  .fcard{ background:#fff; border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .flabel{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12px; font-weight:600; color:var(--ink2); margin-bottom:10px;
  }
  .flabel .tip{ font-size:10.5px; color:var(--ink3); font-weight:500; }
  .input{
    width:100%; border:1px solid var(--line); background:#FAFBFC;
    border-radius:11px; padding:11px 12px; font-size:16px;
    font-family:inherit; color:var(--ink); outline:none;
    transition:border-color .16s, background .16s;
  }
  .input:focus{ border-color:var(--brand-line); background:#fff; }
  input[type=number].input{ -moz-appearance:textfield; }
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  textarea.input{ resize:none; font-size:14px; line-height:1.5; }

  .weight-row{ display:flex; align-items:flex-end; gap:10px; }
  .weight-row .input{ font-size:26px; font-weight:700; letter-spacing:-1px; padding:8px 4px; text-align:center; border:none; background:transparent; }
  .weight-row .unit{ font-size:13px; color:var(--ink3); font-weight:600; padding-bottom:12px; }
  .wdelta{ font-size:11px; font-weight:600; padding-bottom:13px; white-space:nowrap; }
  .wdelta.down{ color:var(--green); }
  .wdelta.up{ color:#E14D3B; }
  .wdelta.flat{ color:var(--ink3); }

  .wrow{
    display:flex; align-items:center; gap:7px;
    background:#FAFBFC; border-radius:12px; padding:9px 10px; margin-bottom:8px;
  }
  .wrow select{
    flex:1 1 auto; min-width:0; border:none; background:transparent; font-size:13px;
    font-family:inherit; color:var(--ink); font-weight:600; outline:none; padding:2px 0;
  }
  .wrow .minwrap{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  .wrow .minwrap input{
    width:46px; min-width:0; border:none; background:#fff; border-radius:8px; padding:6px 2px;
    font-size:14px; font-family:inherit; text-align:center; font-weight:600; outline:none; color:var(--ink);
  }
  .wrow .minwrap span{ font-size:10px; color:var(--ink3); white-space:nowrap; }
  .wrow .kc{ font-size:10.5px; color:var(--brand-deep); font-weight:600; flex:0 0 50px; text-align:right; white-space:nowrap; }
  .wrow .del{
    flex:0 0 20px; border:none; background:transparent; color:#C3CBD4;
    font-size:16px; cursor:pointer; padding:0; line-height:1;
  }
  .addbtn{
    width:100%; border:1.4px dashed #DDE4EC; background:transparent; border-radius:12px;
    padding:9px; font-size:12.5px; color:var(--ink2); font-family:inherit; font-weight:600;
    cursor:pointer; transition:.16s;
  }
  .addbtn:active{ background:#F7F9FB; }
  .wsum{ font-size:11px; color:var(--ink3); margin-top:9px; text-align:right; }
  .wsum b{ color:var(--brand-deep); }

  .meal{ display:flex; align-items:flex-start; gap:9px; margin-bottom:8px; }
  .meal .mi{
    flex:0 0 32px; height:32px; border-radius:10px; display:grid; place-items:center;
    font-size:12px; font-weight:700;
  }
  .meal .mi.b{ background:#FFF1EA; color:#E2542A; }
  .meal .mi.l{ background:#FFF7E8; color:#C08127; }
  .meal .mi.d{ background:#EEF2FB; color:#4B6FB5; }
  .meal .mi.s{ background:#EEFAF3; color:#128C63; }
  .meal .mtx{ flex:1; min-width:0; }
  .meal .mtx .mn{
    display:flex; align-items:baseline; justify-content:space-between;
    font-size:11px; color:var(--ink3); margin-bottom:4px; font-weight:600;
  }
  .meal .mtx .mn .mkcal{ font-size:10.5px; color:var(--brand-deep); font-weight:700; }
  .meal .mtx .input{ font-size:13.5px; padding:8px 10px; }
  .mdetail{ font-size:9.5px; color:#9AA6B2; margin-top:4px; line-height:1.5; word-break:break-word; }
  .mdetail:empty{ display:none; }

  .intake-box{ display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .ib-left{ flex:1 1 auto; min-width:0; }
  .ib-right{ flex:0 0 116px; }
  .ib-k{ font-size:10px; color:var(--ink3); margin-bottom:4px; font-weight:600; }
  .ib-v{ font-size:19px; font-weight:700; color:var(--brand-deep); letter-spacing:-.6px; line-height:1.15; }
  .ib-v small{ font-size:9.5px; font-weight:600; color:var(--ink3); margin-left:3px; letter-spacing:0; }
  .ib-t{ font-size:9px; color:#B7C0CA; margin-top:3px; }
  #inIntake{ font-size:14px; padding:8px 10px; }

  .counter{ display:flex; align-items:center; gap:14px; justify-content:center; padding:2px 0 4px; }
  .cbtn{
    width:34px; height:34px; border-radius:50%; border:none; background:#F1F4F8;
    font-size:18px; color:var(--ink2); cursor:pointer; display:grid; place-items:center;
    transition:.15s; font-family:inherit;
  }
  .cbtn:active{ transform:scale(.9); background:var(--brand-soft); color:var(--brand-deep); }
  .counter .cv{ font-size:19px; font-weight:700; letter-spacing:-.5px; min-width:44px; text-align:center; }
  .counter .cv small{ font-size:10.5px; color:var(--ink3); font-weight:600; margin-left:2px; }

  .btn{
    flex:1; border:none; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700;
    font-family:inherit; cursor:pointer; transition:transform .12s, opacity .16s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:linear-gradient(135deg,#FF8A5B,#FF5A2C); color:#fff; box-shadow:0 8px 20px rgba(255,107,53,.28); }
  .btn-ghost{ background:#fff; color:var(--ink2); box-shadow:var(--shadow); flex:0 0 76px; }
  .btn-sm{ padding:8px 14px; font-size:12px; border-radius:10px; flex:0 0 auto; }

  .toast{
    position:absolute; left:50%; bottom:100px; transform:translate(-50%,16px);
    background:rgba(27,36,48,.92); color:#fff; font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:22px; opacity:0; pointer-events:none;
    transition:.28s; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>

  <div class="viewport" id="viewport">
    <section class="page" id="page-calendar"></section>
    <section class="page hidden" id="page-trend"></section>
    <section class="page hidden" id="page-me"></section>
  </div>

  <nav class="tabbar">
    <div class="tab on" data-tab="calendar">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.6" width="18" height="16" rx="3.6"/>
        <path d="M3 9.6h18M8.2 2.9v3.4M15.8 2.9v3.4"/>
      </svg>
      <span>打卡</span>
    </div>
    <div class="tab" data-tab="trend">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.2 17.2l5.3-5.6 3.7 3.4 6.4-7.2"/>
        <path d="M14.6 7.8h4.2v4.2"/>
        <path d="M3.2 21h17.6"/>
      </svg>
      <span>趋势</span>
    </div>
    <div class="tab" data-tab="me">
      <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.7"/>
        <path d="M4.6 20.2c0-3.7 3.3-6.1 7.4-6.1s7.4 2.4 7.4 6.1"/>
      </svg>
      <span>我的</span>
    </div>
  </nav>

  <div class="mask" id="mask"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle"><i></i></div>
    <div class="sheet-head">
      <div>
        <div class="dt" id="sheetDate">11月9日</div>
        <div class="dw" id="sheetWeek">周一</div>
      </div>
      <button class="xbtn" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost" id="btnClearDay">清除</button>
      <button class="btn btn-primary" id="btnSaveDay">保存记录</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  /* ================= 工具 ================= */
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function dkey(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function todayKey(){
    var t = new Date();
    return dkey(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function dimOf(y, m){ return new Date(y, m + 1, 0).getDate(); }
  function parseKey(k){
    var p = k.split('-');

  }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }

    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){

  function parseQty(seg){

  function findFood(seg){

  /**
   * 估算一段饮食文字的热量
   * 支持: "米饭1碗+鸡胸肉200g" "2个鸡蛋" "半碗粥" "鸡胸肉沙拉"
   * 返回 { total, items:[{name, kcal, guess}] }
   */
  function estimateMeal(text){
    var items = [], total = 0;
    var raw = String(text == null ? '' : text).trim();
    if (!raw) return { total: 0, items: [] };

    var segs = raw.split(/[+＋,，、;；\/\\|\n\r\t ]+|和|还有|以及|加上/).filter(function(s){
      return s && s.trim();
    });
    if (!segs.length) segs = [raw];

    segs.forEach(function(seg){
      var rest = seg, rounds = 0, matched = false;

      while (rest && rounds < 3){
        var hit = findFood(rest);
        if (!hit) break;

        var q = rounds === 0 ? parseQty(rest) : null;
        if (rounds === 0 && !q && /半/.test(rest)) q = { num: 0.5, unit: '份' };

        var kcal = 0, name = '', guess = false;

        if (hit.item){
          var f = hit.item;
          if (q && UNIT_WEIGHT[q.unit] !== undefined && f[4]){
            var grams = q.num * UNIT_WEIGHT[q.unit];
            kcal = f[4] * grams / 100;
            name = f[0] + ' ' + Math.round(grams) + 'g';
          } else if (q && UNIT_VOLUME[q.unit] !== undefined && f[4]){
            var mls = q.num * UNIT_VOLUME[q.unit];
            kcal = f[4] * mls / 100;
            name = f[0] + ' ' + Math.round(mls) + 'ml';
          } else if (q && q.num > 0){
            kcal = f[3] * q.num;
            name = f[0] + ' ' + (q.num % 1 === 0 ? q.num : q.num.toFixed(1)) + (f[2] || '份');
          } else {
            kcal = f[3];
            name = f[0] + ' ' + (f[2] ? '1' + f[2] : '1份');
          }
        } else if (hit.fb){
          var fb = hit.fb;
          guess = true;
          if (q && UNIT_WEIGHT[q.unit] !== undefined){
            kcal = 150 * (q.num * UNIT_WEIGHT[q.unit]) / 100;
            name = fb.n + ' ' + Math.round(q.num * UNIT_WEIGHT[q.unit]) + 'g';
          } else if (q && q.num > 0){
            kcal = fb.k * q.num;
            name = fb.n;
          } else {
            kcal = fb.k;
            name = fb.n;
          }
        }

        kcal = Math.round(kcal);
        total += kcal;
        items.push({ name: name, kcal: kcal, guess: guess });
        matched = true;

        var idx = rest.indexOf(hit.key);
        if (idx < 0) break;
        var before = rest.slice(0, idx).replace(QTY_RE, '');
        var after = rest.slice(idx + hit.key.length);
        rest = (before + after).trim();
        rounds++;
      }

      if (!matched){
        total += 100;
        items.push({ name: seg.slice(0, 10) + '(估)', kcal: 100, guess: true });
      }
    });

    return { total: total, items: items };
  }

  function mealKcalOf(text){ return estimateMeal(text).total; }

  function dayIntakeAuto(d){
    if (!d || !d.meals) return 0;

  /* ================= 状态 ================= */

  /* ================= 业务查询 ================= */
  function dayOf(k){ return state.days[k] || null; }

  function isChecked(k){
    var d = state.days[k];
    if (!d) return false;
    if (num(d.weight) > 0) return true;
    if (d.workouts && d.workouts.length) {
      for (var i = 0; i < d.workouts.length; i++){
        if (num(d.workouts[i].minutes) > 0) return true;
      }
    }
    if (num(d.intake) > 0) return true;
    if (num(d.intakeAuto) > 0) return true;
    if (d.meals){
      for (var j = 0; j < MEAL_KEYS.length; j++){
        var v = d.meals[MEAL_KEYS[j]];
        if (v && String(v).trim()) return true;
      }
    }
    return false;
  }

  function isRest(k){
    var d = state.days[k];
    return !!(d && d.rest);
  }

  function totalMinutes(d){
    if (!d || !d.workouts) return 0;
    var s = 0;
    for (var i = 0; i < d.workouts.length; i++) s += num(d.workouts[i].minutes);
    return s;
  }

  function refWeight(k){
    // 当天体重优先，其次向前回溯最近一次，最后用初始体重
    var d = state.days[k];
    if (d && num(d.weight) > 0) return num(d.weight);
    var keys = Object.keys(state.days).filter(function(x){
      return x < k && num(state.days[x].weight) > 0;
    }).sort();
    if (keys.length) return num(state.days[keys[keys.length - 1]].weight);
    if (num(state.profile.startWeight) > 0) return num(state.profile.startWeight);
    return 65;
  }

  function kcalOf(w, weight){
    var m = METS[w.type] || METS.other;
    return Math.round(m.met * weight * (num(w.minutes) / 60));
  }

  function dayKcal(d, k){
    if (!d || !d.workouts) return 0;
    var w = refWeight(k), s = 0;
    for (var i = 0; i < d.workouts.length; i++) s += kcalOf(d.workouts[i], w);
    return s;
  }

  function monthKeys(y, m){
    var n = dimOf(y, m), out = [];
    for (var i = 1; i <= n; i++) out.push(dkey(y, m, i));
    return out;
  }

  function monthChecked(y, m){
    return monthKeys(y, m).filter(isChecked).length;
  }

  function streakCount(){
    var d = new Date();
    var k = dkey(d.getFullYear(), d.getMonth(), d.getDate());
    if (!isChecked(k)) d.setDate(d.getDate() - 1);
    var n = 0, guard = 0;
    while (guard < 400){
      var kk = dkey(d.getFullYear(), d.getMonth(), d.getDate());
      if (!isChecked(kk) && !isRest(kk)) break;
      if (isChecked(kk)) n++;
      d.setDate(d.getDate() - 1);
      guard++;
    }
    return n;
  }

  function lastWeightBefore(k){
    var keys = Object.keys(state.days).filter(function(x){
      return x < k && num(state.days[x].weight) > 0;
    }).sort();
    if (!keys.length) return null;
    return num(state.days[keys[keys.length - 1]].weight);
  }

  function latestWeight(){
    var keys = Object.keys(state.days).filter(function(x){
      return num(state.days[x].weight) > 0;
    }).sort();
    if (!keys.length) return null;
    return { k: keys[keys.length - 1], v: num(state.days[keys[keys.length - 1]].weight) };

  /* ================= 渲染：日历页 ================= */
  function renderCalendar(){
    var y = state.view.year, m = state.view.month;
    var dim = dimOf(y, m);
    var firstDow = new Date(y, m, 1).getDay();      // 0=周日
    var lead = (firstDow + 6) % 7;                   // 周一为第一列
    var checked = monthChecked(y, m);
    var target = num(state.profile.targetDays) || 20;
    var pct = Math.min(100, Math.round(checked / target * 100));
    var streak = streakCount();
    var tk = todayKey();

    var C = 2 * Math.PI * 30;
    var dash = C * pct / 100;

    var cells = '';
    var prevDim = dimOf(m === 0 ? y - 1 : y, m === 0 ? 11 : m - 1);
    for (var i = 0; i < lead; i++){
      cells += '<div class="cell other"><span class="d">' + (prevDim - lead + i + 1) + '</span></div>';
    }
    for (var d = 1; d <= dim; d++){
      var k = dkey(y, m, d);
      var cls = 'cell';
      if (isChecked(k)) cls += ' done';
      else if (isRest(k)) cls += ' rest';
      if (k === tk) cls += ' today';
      if (k > tk) cls += ' future';
      if (k === editingDate) cls += ' sel';

      var dObj = dayOf(k);
      var tag = '';
      var mins = totalMinutes(dObj);
      if (mins > 0) tag = '<span class="tag">' + mins + '′</span>';
      else if (isChecked(k)) tag = '<span class="dot"></span>';
      else tag = '<span class="tag">&nbsp;</span>';

      cells += '<div class="' + cls + '" data-date="' + k + '"><span class="d">' + d + '</span>' + tag + '</div>';
    }
    var tail = (7 - ((lead + dim) % 7)) % 7;
    for (var t = 1; t <= tail; t++){
      cells += '<div class="cell other"><span class="d">' + t + '</span></div>';
    }

    var weekHead = WEEK_HEAD.map(function(w, idx){
      return '<span class="' + (idx >= 5 ? 'we' : '') + '">' + w + '</span>';
    }).join('');

    var lastW = latestWeight();
    var wVal = lastW ? lastW.v.toFixed(1) : '—';
    var goal = num(state.profile.goalWeight);
    var toGoal = (lastW && goal > 0) ? (lastW.v - goal) : null;

    var monthMins = 0, monthKcal = 0, kcalDays = 0;
    monthKeys(y, m).forEach(function(kk){
      var dd = state.days[kk];
      if (!dd) return;
      monthMins += totalMinutes(dd);
      var kc = dayKcal(dd, kk);
      if (kc > 0){ monthKcal += kc; kcalDays++; }
    });

    var html = '' +
      '<div class="hero">' +
        '<div>' +
          '<div class="mon">' +
            '<button class="mon-btn" id="prevM">‹</button>' +
            '<span>' + y + '年' + (m + 1) + '月</span>' +
            '<button class="mon-btn" id="nextM">›</button>' +
          '</div>' +
          '<div class="sub">已打卡 <b>' + checked + '</b> 天 · 目标 ' + target + ' 天</div>' +
          (streak > 0 ? '<div class="streak">🔥 连续打卡 ' + streak + ' 天</div>' : '<div class="streak" style="background:#F1F4F8;color:#8A97A6">今天还没打卡</div>') +
        '</div>' +
        '<div class="ring-wrap">' +
          '<svg width="78" height="78" viewBox="0 0 78 78">' +
            '<circle cx="39" cy="39" r="30" fill="none" stroke="#EEF2F6" stroke-width="7"/>' +
            (pct > 0
              ? '<circle cx="39" cy="39" r="30" fill="none" stroke="url(#gr)" stroke-width="7" stroke-linecap="round" ' +
                  'stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 39 39)"/>'
              : '') +
            '<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">' +
              '<stop offset="0%" stop-color="#FF9A6B"/><stop offset="100%" stop-color="#FF5226"/>' +
            '</linearGradient></defs>' +
          '</svg>' +
          '<div class="ring-txt"><div class="n">' + pct + '<span>%</span></div><div class="t">本月进度</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title"><span>打卡日历</span><span class="hint">点击日期记录</span></div>' +
        '<div class="weekrow">' + weekHead + '</div>' +
        '<div class="grid">' + cells + '</div>' +
        '<div class="goalbar">' +
          '<div class="row"><span>月度目标进度</span><span><b style="color:#E2542A">' + checked + '</b> / ' + target + ' 天</span></div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '</div>' +
        '<div class="legend">' +
          '<span><i style="background:#FFF1EA"></i>已打卡</span>' +
          '<span><i style="background:#F0F2F6"></i>休息日</span>' +
          '<span><i style="background:#fff;box-shadow:inset 0 0 0 1.5px #FF6B35"></i>今天</span>' +
        '</div>' +
      '</div>' +

      '<div class="quick">' +
        '<div class="qbox"><div class="k">最新体重</div><div class="v">' + wVal + '<small>kg</small></div></div>' +
        '<div class="qbox"><div class="k">本月运动</div><div class="v o">' + monthMins + '<small>分钟</small></div></div>' +
        '<div class="qbox"><div class="k">' + (toGoal === null ? '目标体重' : '距目标') + '</div><div class="v ' + (toGoal !== null && toGoal <= 0 ? 'g' : '') + '">' +
          (toGoal === null ? (goal > 0 ? goal.toFixed(1) + '<small>kg</small>' : '—') : (toGoal > 0 ? toGoal.toFixed(1) + '<small>kg</small>' : '已达成')) +
        '</div></div>' +
      '</div>' +

      '<div class="card" style="margin-top:12px">' +
        '<div class="card-title"><span>最近记录</span><span class="hint">' + (kcalDays > 0 ? '本月消耗约 ' + monthKcal + ' kcal' : '') + '</span></div>' +
        recentList() +
      '</div>';

    var el = document.getElementById('page-calendar');
    el.innerHTML = html;

    el.querySelector('#prevM').onclick = function(){
      var mm = state.view.month - 1, yy = state.view.year;
      if (mm < 0){ mm = 11; yy--; }
      state.view.month = mm; state.view.year = yy;
      saveState(); renderCalendar();
    };
    el.querySelector('#nextM').onclick = function(){
      var mm = state.view.month + 1, yy = state.view.year;
      if (mm > 11){ mm = 0; yy++; }
      state.view.month = mm; state.view.year = yy;
      saveState(); renderCalendar();
    };
    Array.prototype.forEach.call(el.querySelectorAll('.cell[data-date]'), function(c){
      c.onclick = function(){ openDay(c.getAttribute('data-date')); };
    });
  }

  function recentList(){
    var keys = Object.keys(state.days).filter(function(k){
      return isChecked(k) || isRest(k);
    }).sort().reverse().slice(0, 4);
    if (!keys.length){
      return '<div class="empty"><span class="big">🏃</span>还没有记录<br><span style="font-size:11px">点击日历上的日期，开始第一条打卡</span></div>';
    }
    return keys.map(function(k){
      var d = state.days[k];
      var p = parseKey(k);
      var mins = totalMinutes(d);
      var parts = [];
      if (num(d.weight) > 0) parts.push(d.weight.toFixed(1) + ' kg');
      if (mins > 0) parts.push(mins + ' 分钟');
      var itk = intakeEff(d);
      if (itk > 0) parts.push('摄入 ' + itk + ' kcal');
      if (!parts.length) parts.push('休息日');
      var types = (d.workouts || []).map(function(w){
        return (METS[w.type] || METS.other).name;
      }).filter(function(v, i, a){ return a.indexOf(v) === i; }).join(' · ');
      return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F3F6F9">' +
        '<div style="flex:0 0 38px;text-align:center">' +
          '<div style="font-size:15px;font-weight:700;letter-spacing:-.5px">' + p.getDate() + '</div>' +
          '<div style="font-size:9.5px;color:#9BA6B2">' + (p.getMonth() + 1) + '月</div>' +
        '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:12.5px;font-weight:600;color:#1B2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
            (types || (d.rest ? '休息日' : '日常记录')) + '</div>' +
          '<div style="font-size:10.5px;color:#9BA6B2;margin-top:2px">' + parts.join(' · ') + '</div>' +
        '</div>' +
        '<div style="font-size:11px;color:#FF6B35">›</div>' +
      '</div>';
    }).join('');
  }

  /* ================= 抽屉：每日记录 ================= */
  function openDay(k){
    editingDate = k;
    var d = state.days[k] || {};
    draft = {
      weight: num(d.weight) > 0 ? String(d.weight) : '',
      workouts: (d.workouts || []).map(function(w){
        return { type: w.type || 'running', minutes: num(w.minutes) || 0 };
      }),
      meals: {
        b: (d.meals && d.meals.b) || '',
        l: (d.meals && d.meals.l) || '',
        d: (d.meals && d.meals.d) || '',
        s: (d.meals && d.meals.s) || ''
      },
      intake: num(d.intake) > 0 ? String(d.intake) : '',
      water: num(d.water) || 0,
      note: d.note || '',
      rest: !!d.rest
    };
    if (!draft.workouts.length) draft.workouts.push({ type: 'running', minutes: 30 });
    renderSheet();
    renderCalendar();
    document.getElementById('sheet').classList.add('show');
    document.getElementById('mask').classList.add('show');
  }

  function closeSheet(){
    document.getElementById('sheet').classList.remove('show');
    document.getElementById('mask').classList.remove('show');
    editingDate = null;
    renderCalendar();
  }

  function dayIntakeFromDraft(){
    var s = 0;
    MEAL_KEYS.forEach(function(k){ s += mealKcalOf(draft.meals[k]); });
    return s;
  }

  function renderSheet(){
    var p = parseKey(editingDate);
    document.getElementById('sheetDate').textContent = (p.getMonth() + 1) + '月' + p.getDate() + '日';
    var wk = WEEK_CN[p.getDay()];
    var isToday = editingDate === todayKey();
    document.getElementById('sheetWeek').textContent = wk + (isToday ? ' · 今天' : '');

    var prevW = lastWeightBefore(editingDate);
    var deltaHtml = '';
    if (draft.weight !== ''){
      if (prevW){
        var dl = num(draft.weight) - prevW;
        var cls = dl > 0.05 ? 'up' : (dl < -0.05 ? 'down' : 'flat');
        var sign = dl > 0.05 ? '+' : '';
        deltaHtml = '<div class="wdelta ' + cls + '">' + sign + dl.toFixed(1) + ' kg</div>';
      } else {
        deltaHtml = '<div class="wdelta flat">首次</div>';
      }
    }

    var wrows = draft.workouts.map(function(w, i){
      var opts = Object.keys(METS).map(function(t){
        return '<option value="' + t + '"' + (w.type === t ? ' selected' : '') + '>' + METS[t].name + '</option>';
      }).join('');
      var kc = kcalOf(w, refWeight(editingDate));
      return '<div class="wrow" data-i="' + i + '">' +
        '<select class="wtype">' + opts + '</select>' +
        '<div class="minwrap"><input class="wmin" type="number" inputmode="numeric" min="0" max="600" value="' + (num(w.minutes) || '') + '" placeholder="0"><span>分钟</span></div>' +
        '<div class="kc">' + (kc > 0 ? kc + ' kcal' : '—') + '</div>' +
        '<button class="del" type="button">✕</button>' +
      '</div>';
    }).join('');

    var mealHtml = MEAL_KEYS.map(function(mk){
      var est = estimateMeal(draft.meals[mk]);
      var detail = est.items.map(function(it){ return it.name + ' ' + it.kcal; }).join(' · ');
      return '<div class="meal">' +
        '<div class="mi ' + mk + '">' + MEAL_NAMES[mk].charAt(0) + '</div>' +
        '<div class="mtx">' +
          '<div class="mn"><span>' + MEAL_NAMES[mk] + '</span>' +
            '<span class="mkcal" id="mk-' + mk + '">' + (est.total > 0 ? '≈ ' + est.total + ' kcal' : '') + '</span>' +
          '</div>' +
          '<input class="input meal-in" data-m="' + mk + '" placeholder="如：米饭1碗 + 鸡胸肉200g" value="' + esc(draft.meals[mk]) + '">' +
          '<div class="mdetail" id="md-' + mk + '">' + esc(detail) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var totalMin = 0, totalKc = 0;
    draft.workouts.forEach(function(w){
      totalMin += num(w.minutes);
      totalKc += kcalOf(w, refWeight(editingDate));
    });

    var body = '' +
      '<div class="fcard">' +
        '<div class="flabel"><span>今日体重</span><span class="tip">' + (prevW ? '上次 ' + prevW.toFixed(1) + ' kg' : '暂无可对比记录') + '</span></div>' +
        '<div class="weight-row">' +
          '<input class="input" id="inWeight" type="number" inputmode="decimal" step="0.1" min="0" max="300" placeholder="—" value="' + esc(draft.weight) + '">' +
          '<div class="unit">kg</div>' +
          deltaHtml +
        '</div>' +
      '</div>' +

      '<div class="fcard">' +
        '<div class="flabel"><span>运动记录</span><span class="tip">按 MET 自动估算消耗</span></div>' +
        '<div id="wlist">' + wrows + '</div>' +
        '<button class="addbtn" id="addWorkout" type="button">+ 添加一项运动</button>' +
        '<div class="wsum" id="wsum">合计 <b>' + totalMin + '</b> 分钟 · 约 <b>' + totalKc + '</b> kcal</div>' +
      '</div>' +

      '<div class="fcard">' +
        '<div class="flabel"><span>饮食记录</span><span class="tip">自动估算热量</span></div>' +
        mealHtml +
        '<div class="intake-box">' +
          '<div class="ib-left">' +
            '<div class="ib-k">今日摄入</div>' +
            '<div class="ib-v" id="intakeAuto">≈ ' + dayIntakeFromDraft() + '<small>kcal</small></div>' +
            '<div class="ib-t">根据食物自动估算</div>' +
          '</div>' +
          '<div class="ib-right">' +
            '<div class="ib-k">手动修正</div>' +
            '<input class="input" id="inIntake" type="number" inputmode="numeric" min="0" max="9999" placeholder="可留空" value="' + esc(draft.intake) + '">' +
            '<div class="ib-t" style="text-align:right">填入后以此为准</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="fcard">' +
        '<div class="flabel"><span>饮水量</span><span class="tip">每杯约 250ml</span></div>' +
        '<div class="counter">' +
          '<button class="cbtn" id="wMinus" type="button">−</button>' +
          '<div class="cv" id="waterVal">' + draft.water + '<small>杯</small></div>' +
          '<button class="cbtn" id="wPlus" type="button">+</button>' +
        '</div>' +
      '</div>' +

      '<div class="fcard">' +
        '<div class="flabel"><span>备注</span><span class="tip">状态、感受、伤病…</span></div>' +
        '<input class="input" id="inNote" placeholder="今天感觉怎么样？" value="' + esc(draft.note) + '" style="font-size:14px">' +
      '</div>' +

      '<div class="fcard" style="display:flex;align-items:center;justify-content:space-between">' +
        '<div><div style="font-size:12.5px;font-weight:600;color:#5A6675">标记为休息日</div>' +
        '<div style="font-size:10.5px;color:#9BA6B2;margin-top:3px">计划内休息，不计入缺卡</div></div>' +
        '<div id="restToggle" style="width:46px;height:27px;border-radius:20px;background:' + (draft.rest ? '#FF6B35' : '#E4E9EF') + ';position:relative;cursor:pointer;transition:.2s">' +
          '<div style="position:absolute;top:3px;left:' + (draft.rest ? '22px' : '3px') + ';width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.15)"></div>' +
        '</div>' +
      '</div>' +
      '<div style="height:6px"></div>';

    document.getElementById('sheetBody').innerHTML = body;
    bindSheet();
  }

  function bindSheet(){
    var body = document.getElementById('sheetBody');

    body.querySelector('#inWeight').addEventListener('input', function(e){
      draft.weight = e.target.value;
      var prevW = lastWeightBefore(editingDate);
      var row = body.querySelector('.weight-row');
      var old = row.querySelector('.wdelta');
      if (old) old.remove();
      if (draft.weight !== '' && prevW){
        var dl = num(draft.weight) - prevW;
        var cls = dl > 0.05 ? 'up' : (dl < -0.05 ? 'down' : 'flat');
        var el = document.createElement('div');
        el.className = 'wdelta ' + cls;
        el.textContent = (dl > 0.05 ? '+' : '') + dl.toFixed(1) + ' kg';
        row.appendChild(el);
      }
    });

    body.querySelector('#inIntake').addEventListener('input', function(e){ draft.intake = e.target.value; });
    body.querySelector('#inNote').addEventListener('input', function(e){ draft.note = e.target.value; });

    Array.prototype.forEach.call(body.querySelectorAll('.meal-in'), function(inp){
      inp.addEventListener('input', function(e){
        var mk = e.target.getAttribute('data-m');
        draft.meals[mk] = e.target.value;
        refreshMeal(mk);
      });
    });

    function refreshMeal(mk){
      var est = estimateMeal(draft.meals[mk]);
      var kEl = body.querySelector('#mk-' + mk);
      if (kEl) kEl.textContent = est.total > 0 ? '≈ ' + est.total + ' kcal' : '';
      var dEl = body.querySelector('#md-' + mk);
      if (dEl) dEl.textContent = est.items.map(function(it){ return it.name + ' ' + it.kcal; }).join(' · ');
      var aEl = body.querySelector('#intakeAuto');
      if (aEl) aEl.innerHTML = '≈ ' + dayIntakeFromDraft() + '<small>kcal</small>';
    }

    body.querySelector('#wMinus').onclick = function(){
      draft.water = Math.max(0, draft.water - 1);
      body.querySelector('#waterVal').innerHTML = draft.water + '<small>杯</small>';
    };
    body.querySelector('#wPlus').onclick = function(){
      draft.water = Math.min(30, draft.water + 1);
      body.querySelector('#waterVal').innerHTML = draft.water + '<small>杯</small>';
    };

    body.querySelector('#restToggle').onclick = function(){
      draft.rest = !draft.rest;
      renderSheet();
    };

    body.querySelector('#addWorkout').onclick = function(){
      draft.workouts.push({ type: 'running', minutes: '' });
      renderSheet();
    };

    function refreshSum(){
      var tm = 0, tk = 0;
      draft.workouts.forEach(function(w){
        tm += num(w.minutes);
        tk += kcalOf(w, refWeight(editingDate));
      });
      var s = body.querySelector('#wsum');
      if (s) s.innerHTML = '合计 <b>' + tm + '</b> 分钟 · 约 <b>' + tk + '</b> kcal';
    }

    Array.prototype.forEach.call(body.querySelectorAll('.wrow'), function(row){
      var i = +row.getAttribute('data-i');
      var sel = row.querySelector('.wtype');
      var min = row.querySelector('.wmin');
      var kcEl = row.querySelector('.kc');

      sel.addEventListener('change', function(){
        draft.workouts[i].type = sel.value;
        var kc = kcalOf(draft.workouts[i], refWeight(editingDate));
        kcEl.textContent = kc > 0 ? kc + ' kcal' : '—';
        refreshSum();
      });
      min.addEventListener('input', function(){
        draft.workouts[i].minutes = min.value;
        var kc = kcalOf(draft.workouts[i], refWeight(editingDate));
        kcEl.textContent = kc > 0 ? kc + ' kcal' : '—';
        refreshSum();
      });
      row.querySelector('.del').onclick = function(){
        draft.workouts.splice(i, 1);
        if (!draft.workouts.length) draft.workouts.push({ type: 'running', minutes: '' });
        renderSheet();
      };
    });
  }

  function saveDay(){
    var k = editingDate;
    if (!k) return;
    var d = {
      weight: num(draft.weight),
      workouts: draft.workouts.map(function(w){
        return { type: w.type, minutes: num(w.minutes) };
      }).filter(function(w){ return w.minutes > 0; }),
      meals: {
        b: draft.meals.b.trim(),
        l: draft.meals.l.trim(),
        d: draft.meals.d.trim(),
        s: draft.meals.s.trim()
      },
      intake: num(draft.intake),
      intakeAuto: dayIntakeFromDraft(),
      water: num(draft.water),
      note: draft.note.trim(),
      rest: !!draft.rest,
      updatedAt: Date.now()
    };
    var hasContent = d.weight > 0 || d.workouts.length || d.intake > 0 || d.water > 0 ||
      d.note || d.rest || MEAL_KEYS.some(function(mk){ return d.meals[mk]; });

    if (hasContent) state.days[k] = d;
    else delete state.days[k];

    saveState();
    closeSheet();
    renderCurrent();
    toast(hasContent ? '记录已保存' : '记录已清空');
  }

  function clearDay(){
    if (!editingDate) return;
    delete state.days[editingDate];
    saveState();
    closeSheet();
    renderCurrent();
    toast('已删除当天记录');
  }

  /* ================= 趋势页 ================= */
  function renderTrend(){
    var y = state.view.year, m = state.view.month;
    var keys = monthKeys(y, m);
    var checked = 0, mins = 0, kc = 0, wsum = 0, wcnt = 0;
    var firstW = null, lastW = null;

    keys.forEach(function(k){
      var d = state.days[k];
      if (!d) return;
      if (isChecked(k)) checked++;
      mins += totalMinutes(d);
      kc += dayKcal(d, k);
      if (num(d.weight) > 0){
        wsum += num(d.weight); wcnt++;
        if (firstW === null) firstW = num(d.weight);
        lastW = num(d.weight);
      }
    });

    var avgW = wcnt ? (wsum / wcnt) : null;
    var change = (firstW !== null && lastW !== null) ? (lastW - firstW) : null;
    var goal = num(state.profile.goalWeight);
    var toGoal = (lastW !== null && goal > 0) ? (lastW - goal) : null;

    function changeCls(v){
      if (v === null) return 'flat';
      if (v > 0.05) return 'up';
      if (v < -0.05) return 'down';
      return 'flat';
    }
    function changeTxt(v, unit){
      if (v === null) return '数据不足';
      var s = v > 0 ? '+' : '';
      return s + v.toFixed(1) + (unit || '');
    }

    var el = document.getElementById('page-trend');
    el.innerHTML = '' +
      '<div class="hero" style="padding-bottom:14px">' +
        '<div><div class="mon"><span>' + y + '年' + (m + 1) + '月</span></div>' +
        '<div class="sub">本月已记录 <b>' + checked + '</b> 天 · 共 ' + dimOf(y, m) + ' 天</div></div>' +
      '</div>' +

      '<div class="stat-grid">' +
        '<div class="stat"><div class="k">打卡天数</div>' +
          '<div class="v">' + checked + '<small>天</small></div>' +
          '<div class="d flat">目标 ' + (num(state.profile.targetDays) || 20) + ' 天</div>' +
          '<div class="ico" style="background:#FFF1EA">🗓</div></div>' +
        '<div class="stat"><div class="k">运动时长</div>' +
          '<div class="v">' + mins + '<small>分钟</small></div>' +
          '<div class="d down">约消耗 ' + kc + ' kcal</div>' +
          '<div class="ico" style="background:#E8F7F1">🔥</div></div>' +
        '<div class="stat"><div class="k">平均体重</div>' +
          '<div class="v">' + (avgW === null ? '—' : avgW.toFixed(1)) + '<small>kg</small></div>' +

  function emptyChart(host, text){
    host.innerHTML = '<div class="empty"><span class="big">📊</span>' + text + '</div>';
  }

  function drawWeightChart(y, m){
    var host = document.getElementById('weightChart');
    if (!host) return;
    var dim = dimOf(y, m);
    var data = [];
    for (var i = 1; i <= dim; i++){
      var k = dkey(y, m, i);
      var d = state.days[k];
      if (d && num(d.weight) > 0) data.push({ x: i, y: num(d.weight) });
    }
    if (data.length < 1){ emptyChart(host, '本月还没有体重数据<br><span style="font-size:10.5px">记录体重后自动生成曲线</span>'); return; }

    var W = host.clientWidth || 330, H = 168;
    var pad = { l: 36, r: 12, t: 14, b: 22 };
    var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

    var vals = data.map(function(p){ return p.y; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (mx - mn < 1){ mn -= 0.6; mx += 0.6; }
    else { mn -= (mx - mn) * 0.18; mx += (mx - mn) * 0.18; }

    function X(day){ return pad.l + (day - 1) / (dim - 1) * pw; }
    function Y(v){ return pad.t + (1 - (v - mn) / (mx - mn)) * ph; }

    var gridLines = '', ticks = 4;
    for (var g = 0; g <= ticks; g++){
      var v = mn + (mx - mn) * g / ticks;
      var yy = Y(v);
      gridLines += '<line x1="' + pad.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(1) + '" stroke="#F0F3F7" stroke-width="1"/>';
      gridLines += '<text x="' + (pad.l - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="#A8B3C0">' + v.toFixed(1) + '</text>';
    }

    var pts = data.map(function(p){ return [X(p.x), Y(p.y)]; });
    var line = '';
    for (var j = 0; j < pts.length; j++){
      line += (j === 0 ? 'M' : 'L') + pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1);
      if (j < pts.length - 1) line += ' ';
    }
    var area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - pad.b) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pad.b) + ' Z';

    var dots = pts.map(function(p){
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#fff" stroke="#FF6B35" stroke-width="2"/>';
    }).join('');

    var last = pts[pts.length - 1];
    var lastLabel = '<g><rect x="' + Math.min(W - pad.r - 42, Math.max(pad.l, last[0] - 21)) + '" y="' + (last[1] - 22) + '" width="42" height="17" rx="8" fill="#FF6B35"/>' +
      '<text x="' + Math.min(W - pad.r - 21, Math.max(pad.l + 21, last[0])) + '" y="' + (last[1] - 10) + '" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="600">' + data[data.length - 1].y.toFixed(1) + '</text></g>';

    var xlabels = '';
    [1, Math.round(dim / 2), dim].forEach(function(day){
      xlabels += '<text x="' + X(day).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="#A8B3C0">' + day + '日</text>';
    });

    host.innerHTML = '<svg width="' + W + '" height="' + H + '" style="display:block">' +
      '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#FF6B35" stop-opacity=".22"/>' +
        '<stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      gridLines +
      '<path d="' + area + '" fill="url(#wg)"/>' +
      '<path d="' + line + '" fill="none" stroke="#FF6B35" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + lastLabel + xlabels +
    '</svg>';
  }

  function drawMinChart(y, m){
    var host = document.getElementById('minChart');
    if (!host) return;
    var dim = dimOf(y, m);
    var vals = [], any = false;
    for (var i = 1; i <= dim; i++){
      var v = totalMinutes(state.days[dkey(y, m, i)]);
      vals.push(v);
      if (v > 0) any = true;
    }
    if (!any){ emptyChart(host, '本月还没有运动记录<br><span style="font-size:10.5px">记下运动时长后生成柱状图</span>'); return; }

    var W = host.clientWidth || 330, H = 150;
    var pad = { l: 30, r: 8, t: 12, b: 22 };
    var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    var mx = Math.max.apply(null, vals);
    mx = Math.ceil(mx / 30) * 30 || 30;

    var band = pw / dim;
    var bw = Math.max(3, band * 0.6);

    var gridLines = '';
    for (var g = 0; g <= 2; g++){
      var vv = mx * g / 2;
      var yy = pad.t + ph - (vv / mx) * ph;
      gridLines += '<line x1="' + pad.l + '" y1="' + yy.toFixed(1) + '" x2="' + (W - pad.r) + '" y2="' + yy.toFixed(1) + '" stroke="#F0F3F7"/>';
      gridLines += '<text x="' + (pad.l - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="#A8B3C0">' + Math.round(vv) + '</text>';
    }

    var bars = vals.map(function(v, i){
      var h = v > 0 ? Math.max(2.5, (v / mx) * ph) : 0;
      if (h <= 0) return '';
      var x = pad.l + i * band + (band - bw) / 2;
      var yy = pad.t + ph - h;
      return '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(3, bw / 2).toFixed(1) + '" fill="url(#mg)"/>';
    }).join('');

    var xlabels = '';
    [1, Math.round(dim / 2), dim].forEach(function(day){
      xlabels += '<text x="' + (pad.l + (day - 1) * band + band / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="#A8B3C0">' + day + '</text>';
    });

    host.innerHTML = '<svg width="' + W + '" height="' + H + '" style="display:block">' +
      '<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#FF8A5B"/><stop offset="100%" stop-color="#FFC9AE"/>' +
      '</linearGradient></defs>' + gridLines + bars + xlabels + '</svg>';
  }

  function drawTypeBreak(y, m){
    var host = document.getElementById('typeBreak');
    if (!host) return;
    var agg = {};
    monthKeys(y, m).forEach(function(k){
      var d = state.days[k];
      if (!d || !d.workouts) return;
      d.workouts.forEach(function(w){
        var t = w.type || 'other';
        agg[t] = (agg[t] || 0) + num(w.minutes);
      });
    });
    var arr = Object.keys(agg).map(function(t){ return { t: t, v: agg[t] }; })
      .filter(function(o){ return o.v > 0; })
      .sort(function(a, b){ return b.v - a.v; });
    if (!arr.length){ host.innerHTML = '<div class="empty" style="padding:20px 0"><span style="font-size:11.5px">暂无运动类型数据</span></div>'; return; }
    var total = arr.reduce(function(s, o){ return s + o.v; }, 0);
    var colors = ['#FF6B35', '#FFA26B', '#FFC9AE', '#3B82F6', '#7DB3FF', '#12A06B', '#6FD3AC', '#A78BFA', '#C4B5FD'];

    var segs = arr.map(function(o, i){
      var pct = o.v / total * 100;
      return '<div style="flex:' + pct.toFixed(2) + ';background:' + colors[i % colors.length] + '"></div>';
    }).join('');

    var rows = arr.map(function(o, i){
      var pct = Math.round(o.v / total * 100);
      return '<div style="display:flex;align-items:center;gap:9px;padding:7px 0">' +
        '<i style="width:8px;height:8px;border-radius:3px;display:block;background:' + colors[i % colors.length] + '"></i>' +
        '<span style="flex:1;font-size:12.5px;color:#5A6675;font-weight:600">' + (METS[o.t] ? METS[o.t].name : '其他') + '</span>' +
        '<span style="font-size:11.5px;color:#9BA6B2;font-variant-numeric:tabular-nums">' + o.v + ' 分钟</span>' +
        '<span style="font-size:11.5px;color:#1B2430;font-weight:700;width:36px;text-align:right">' + pct + '%</span>' +
      '</div>';
    }).join('');

    host.innerHTML = '<div style="display:flex;height:9px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:6px">' + segs + '</div>' + rows;
  }

  function drawKcalBalance(y, m){
    var host = document.getElementById('kcalBalance');
    if (!host) return;

    var inSum = 0, inDays = 0, burnSum = 0, burnDays = 0;
    monthKeys(y, m).forEach(function(k){
      var d = state.days[k];
      if (!d) return;
      var it = intakeEff(d);
      if (it > 0){ inSum += it; inDays++; }
      var bu = dayKcal(d, k);
      if (bu > 0){ burnSum += bu; burnDays++; }
    });

    if (!inDays && !burnDays){
      host.innerHTML = '<div class="empty" style="padding:16px 0"><span style="font-size:11.5px">本月还没有饮食或运动数据</span></div>';
      return;
    }

    var base = Math.max(inDays, burnDays, 1);
    var avgIn = Math.round(inSum / base);
    var avgBurn = Math.round(burnSum / base);
    var net = avgIn - avgBurn;
    var max = Math.max(avgIn, avgBurn, 1);
    var wIn = Math.max(2, avgIn / max * 100);
    var wBurn = Math.max(2, avgBurn / max * 100);

    var netCls = net > 0 ? 'up' : (net < 0 ? 'down' : 'flat');
    var netTxt = (net > 0 ? '+' : '') + net;

    function bar(label, pct, color){
      return '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">' +
        '<span style="font-size:10px;color:#9BA6B2;width:30px;flex:0 0 30px">' + label + '</span>' +
        '<div style="flex:1;height:9px;background:#F1F4F8;border-radius:6px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + pct.toFixed(1) + '%;background:' + color + ';border-radius:6px"></i>' +
        '</div>' +
      '</div>';
    }

    host.innerHTML =
      '<div style="display:flex;gap:10px;margin-bottom:12px">' +
        '<div style="flex:1">' +
          '<div style="font-size:10px;color:#9BA6B2;margin-bottom:4px">日均摄入</div>' +
          '<div style="font-size:18px;font-weight:700;letter-spacing:-.6px;color:#1B2430">' + avgIn + '<small style="font-size:9.5px;color:#9BA6B2;font-weight:600;margin-left:3px">kcal</small></div>' +
        '</div>' +
        '<div style="flex:1">' +
          '<div style="font-size:10px;color:#9BA6B2;margin-bottom:4px">日均消耗</div>' +
          '<div style="font-size:18px;font-weight:700;letter-spacing:-.6px;color:#12A06B">' + avgBurn + '<small style="font-size:9.5px;color:#9BA6B2;font-weight:600;margin-left:3px">kcal</small></div>' +
        '</div>' +
      '</div>' +
      bar('摄入', wIn, 'linear-gradient(90deg,#FF9A6B,#FF5A2C)') +
      bar('消耗', wBurn, 'linear-gradient(90deg,#5AD1A6,#12A06B)') +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed #EDF0F4">' +
        '<span style="font-size:11px;color:#5A6675">日均净值<span style="font-size:9px;color:#B7C0CA;margin-left:5px">不含基础代谢</span></span>' +
        '<span style="font-size:15px;font-weight:700;letter-spacing:-.4px;color:' + (net > 0 ? '#E14D3B' : (net < 0 ? '#12A06B' : '#9BA6B2')) + '">' + netTxt + ' kcal</span>' +
      '</div>';
  }

  function bmiLabel(v){
    var n = parseFloat(v);
    if (n < 18.5) return '偏瘦';
    if (n < 24) return '正常范围';
    if (n < 28) return '超重';
    return '肥胖';
  }

  function totalKcalAll(){
    var s = 0;
    Object.keys(state.days).forEach(function(k){ s += dayKcal(state.days[k], k); });
    return s;
  }

  function rowItem(icon, color, title, sub, id, danger){
    return '<div class="li' + (danger ? ' danger' : '') + '" id="' + id + '">' +
      '<div class="ic" style="background:' + color + '">' + icon + '</div>' +
      '<div class="tx">' + title + '<div class="s">' + sub + '</div></div>' +
      '<div class="arrow">›</div>' +
    '</div>';
  }

  /* 简易数值输入（用 prompt 兜底，兼容性最好） */
  function askNumber(title, unit, current, cb){
    var cur = current ? String(current) : '';
    var v = window.prompt(title + '（单位：' + unit + '）', cur);
    if (v === null) return;
    v = parseFloat(v);
    if (!isFinite(v) || v <= 0){ toast('请输入有效数字'); return; }
    cb(v);
    toast(title + '已更新');
  }

  /* ================= 数据导入导出 ================= */
  function exportData(){
    var data = JSON.stringify({
      app: 'fitness-checkin',
      version: 1,
      exportedAt: new Date().toISOString(),
      profile: state.profile,
      days: state.days
    }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var t = new Date();
    a.href = url;
    a.download = '健身打卡备份-' + t.getFullYear() + pad2(t.getMonth() + 1) + pad2(t.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    toast('已导出备份文件');
  }

  function importData(){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function(){
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(){
        try {
          var obj = JSON.parse(reader.result);
          if (obj.days && typeof obj.days === 'object'){
            var cnt = Object.keys(obj.days).length;
            if (!window.confirm('将导入 ' + cnt + ' 天的记录，并覆盖同名日期。继续？')) return;
            for (var k in obj.days){
              if (obj.days.hasOwnProperty(k)) state.days[k] = obj.days[k];
            }
            if (obj.profile) for (var p in obj.profile) state.profile[p] = obj.profile[p];
            saveState(); renderMe(); renderCalendar();
            toast('已导入 ' + cnt + ' 天记录');
          } else {
            toast('文件格式不正确');
          }
        } catch(e){ toast('解析失败，请检查文件'); }
      };
      reader.readAsText(f);
    };
    input.click();
  }

  function clearAll(){
    if (!window.confirm('确定清空所有打卡记录？此操作不可恢复。')) return;
    state.days = {};
    saveState();
    renderMe(); renderCalendar();
    toast('已清空所有记录');
  }

  function loadDemo(){

    var y = state.view.year, m = state.view.month;
    var dim = dimOf(y, m);
    var t = new Date();
    var maxDay = (t.getFullYear() === y && t.getMonth() === m) ? t.getDate() : dim;
    var baseW = 74.2;
    var types = ['running', 'strength', 'cycling', 'swimming', 'yoga', 'rope', 'walking'];
    var meals = [
      ['燕麦粥 + 水煮蛋', '鸡胸肉沙拉', '清蒸鱼 + 糙米饭', '酸奶'],
      ['全麦面包 + 牛奶', '牛肉饭', '蔬菜汤 + 鸡胸', ''],
      ['鸡蛋三明治', '三文鱼藜麦碗', '番茄牛肉面', '香蕉'],
      ['豆浆 + 包子', '轻食便当', '虾仁豆腐 + 杂粮饭', '坚果一小把']
    ];
    for (var i = 1; i <= maxDay; i++){
      if (i % 7 === 0){ // 每周留一天休息
        state.days[dkey(y, m, i)] = { weight: 0, workouts: [], meals: { b:'', l:'', d:'', s:'' }, intake: 0, water: 3, note: '计划休息日', rest: true };
        continue;
      }
      if (i % 5 === 4) continue; // 偶尔漏一天，更真实
      baseW = +(baseW - 0.18 + (Math.random() - 0.5) * 0.36).toFixed(1);
      var tn = 1 + (i % 2);
      var ws = [];
      for (var j = 0; j < tn; j++){
        ws.push({ type: types[(i + j) % types.length], minutes: 20 + ((i * 7 + j * 13) % 40) });
      }
      var mset = meals[i % meals.length];
      state.days[dkey(y, m, i)] = {
        weight: Math.max(68, baseW),
        workouts: ws,
        meals: { b: mset[0], l: mset[1], d: mset[2], s: mset[3] },
        intake: 0,
        intakeAuto: 0,
        water: 5 + (i % 4),
        note: i % 4 === 0 ? '状态不错，力量有提升' : '',
        rest: false,
        updatedAt: Date.now()
      };
    }
    saveState();
    renderMe(); renderCalendar();
    toast('示例数据已载入');
  }

  /* ================= 通用 ================= */
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }

  function renderCurrent(){
    var active = document.querySelector('.tab.on').getAttribute('data-tab');
    if (active === 'calendar') renderCalendar();
    else if (active === 'trend') renderTrend();
    else renderMe();
  }

  function switchTab(tab){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.classList.toggle('on', t.getAttribute('data-tab') === tab);
    });
    ['calendar', 'trend', 'me'].forEach(function(name){
      document.getElementById('page-' + name).classList.toggle('hidden', name !== tab);
    });
    document.getElementById('viewport').scrollTop = 0;
    if (tab === 'calendar') renderCalendar();
    else if (tab === 'trend') renderTrend();
    else renderMe();
  }

  /* ================= 初始化 ================= */
  function init(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.onclick = function(){ switchTab(t.getAttribute('data-tab')); };
    });
    document.getElementById('mask').onclick = closeSheet;
    document.getElementById('sheetClose').onclick = closeSheet;
    document.getElementById('btnSaveDay').onclick = saveDay;
    document.getElementById('btnClearDay').onclick = clearDay;

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') closeSheet();
    });

    // 状态栏时钟
    function tick(){
      var d = new Date();
      document.getElementById('clock').textContent = d.getHours() + ':' + pad2(d.getMinutes());
    }
    tick();
    setInterval(tick, 20000);

    renderCalendar();

    // 首次使用引导
    if (Object.keys(state.days).length === 0){
      setTimeout(function(){ toast('点击今天，开始第一次打卡'); }, 700);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
